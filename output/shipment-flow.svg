<text x="386" y="834" font-size="12.5" fill="#3f3416" font-weight="400">1、每天下午 4:30 佳欣在平台中操作输入出货数量、封装、Bin 别、测试程序、发货备注、提货方式</text>
<text x="386" y="851" font-size="12.5" fill="#3f3416" font-weight="400">、要求发货日、收件人/电话/地址</text>
<text x="386" y="868" font-size="12.5" fill="#3f3416" font-weight="400">2、佳欣点击提交后，后台调用 ERP API 同步创建出库单。若有个别已审批单据需要调整，可以撤回审</text>
<text x="386" y="885" font-size="12.5" fill="#3f3416" font-weight="400">批。</text>
<text x="386" y="902" font-size="12.5" fill="#3f3416" font-weight="400">3、点击【发送今日邮件】，信息包含今天需要通知测试厂的销货通知（含重审后的单据）➡ 佳欣邮箱复</text>
