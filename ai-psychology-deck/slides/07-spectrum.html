<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: #FAFAF7;
    font-family: 'EB Garamond', Georgia, serif;
    color: #0D0D0D;
  }
  .slide {
    width: 1920px; height: 1080px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 200px;
  }
  .kicker {
    position: absolute;
    top: 88px; left: 200px;
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #B5192A;
  }
  .slide-num {
    position: absolute;
    top: 88px; right: 200px;
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    font-size: 12px;
    letter-spacing: 0.15em;
    color: #C4C1BA;
  }
  .label {
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #B0ADA5;
    margin-bottom: 56px;
  }
  /* Paula Scher: two giant words pulling in opposite directions */
  .tension {
    display: flex;
    align-items: baseline;
    gap: 0;
    margin-bottom: 64px;
  }
  .word-left {
    font-size: 140px;
    font-weight: 700;
    line-height: 0.9;
    letter-spacing: -0.05em;
  }
  .word-left em {
    display: block;
    font-size: 52px;
    font-style: italic;
    font-weight: 400;
    color: #8A8780;
    letter-spacing: -0.01em;
    margin-top: 12px;
  }
  .arrow {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 0 60px;
    padding-bottom: 28px;
  }
  .arrow-track {
    width: 100%;
    height: 1px;
    background: linear-gradient(to right, #0D0D0D 0%, #B5192A 50%, #0D0D0D 100%);
    position: relative;
  }
  .arrow-track::before,
  .arrow-track::after {
    content: '';
    position: absolute;
    top: -5px;
    width: 11px;
    height: 11px;
    border-right: 1px solid #0D0D0D;
    border-top: 1px solid #0D0D0D;
  }
  .arrow-track::before {
    left: -2px;
    transform: rotate(-135deg);
  }
  .arrow-track::after {
    right: -2px;
    transform: rotate(45deg);
    border-color: #0D0D0D;
  }
  .arrow-label {
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 0.22em;
    color: #B5192A;
    text-transform: uppercase;
  }
  .word-right {
    font-size: 140px;
    font-weight: 700;
    line-height: 0.9;
    letter-spacing: -0.05em;
    color: #B5192A;
    text-align: right;
  }
  .word-right em {
    display: block;
    font-size: 52px;
    font-style: italic;
    font-weight: 400;
    color: #D4697A;
    letter-spacing: -0.01em;
    margin-top: 12px;
  }
  .rule {
    width: 56px; height: 3px;
    background: #D8D5CE;
    margin-bottom: 40px;
  }
  .body-text {
    font-size: 26px;
    line-height: 1.65;
    color: #4A4845;
    max-width: 900px;
    font-style: italic;
  }
  .body-text strong {
    font-style: normal;
    font-weight: 600;
    color: #0D0D0D;
  }
  /* Markers on the spectrum */
  .spectrum-row {
    display: flex;
    align-items: center;
    gap: 0;
    margin-bottom: 80px;
  }
  .marker {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .marker-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #D8D5CE;
  }
  .marker-dot.active {
    background: #B5192A;
    width: 14px; height: 14px;
  }
  .marker-text {
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: #B0ADA5;
    text-align: center;
    line-height: 1.4;
    max-width: 120px;
  }
  .marker-text.active {
    color: #B5192A;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="kicker">Part 06 · Symbiosis vs Dependence</div>
  <div class="slide-num">07 / 08</div>

  <div class="label">The Critical Distinction</div>

  <div class="tension">
    <div class="word-left">
      共生
      <em>Symbiosis</em>
    </div>
    <div class="arrow">
      <div class="arrow-track"></div>
      <div class="arrow-label">临界点</div>
    </div>
    <div class="word-right">
      依赖
      <em>Dependence</em>
    </div>
  </div>

  <div class="rule"></div>
  <p class="body-text">
    工具放大了人类能力，这是<strong>共生</strong>。<br>
    当没有工具你就无法思考，这是<strong>依赖</strong>。<br>
    你在光谱的哪里——<strong>你知道吗？</strong>
  </p>
</div>
</body>
</html>
